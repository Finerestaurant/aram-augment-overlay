name: Release

# Tag a version and the exe shows up on the release page:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The build is held to the parity suite first, so a tag cannot ship an exe that
# failed its own tests.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스로 만들 태그 (예: v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Parity self-test
        run: dotnet run --project src/AramOverlay.SelfTest -c Release -- ${{ github.workspace }}

      - name: Publish single file
        run: >
          dotnet publish src/AramOverlay.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/ARAM-Augment-Overlay.exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item publish/ARAM-Augment-Overlay.exe).Length / 1MB, 1)
          "SHA256: $hash" | Out-File publish/SHA256.txt -Encoding utf8
          "EXE_SHA256=$hash" | Out-File -Append $env:GITHUB_ENV
          "EXE_SIZE=$size"   | Out-File -Append $env:GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            publish/ARAM-Augment-Overlay.exe
            publish/SHA256.txt
          body: |
            리그 오브 레전드 **무작위 총력전: 아수라장**에서 획득한 증강을 OBS 화면에 누적 표시합니다.

            ### 받는 법
            아래 `ARAM-Augment-Overlay.exe` 하나만 받으면 됩니다. 설치도, 다른 프로그램도 필요 없습니다.

            처음 실행할 때 **"Windows에서 PC를 보호했습니다"** 경고가 뜹니다. 코드 서명을 하지 않은
            프로그램이라 그렇습니다. **추가 정보 → 실행**을 누르면 됩니다.
            받으신 파일이 맞는지 확인하시려면:

            ```
            Get-FileHash ARAM-Augment-Overlay.exe -Algorithm SHA256
            ```
            `${{ env.EXE_SHA256 }}`

            ### 준비물
            - Windows 10 / 11, 1920×1080 해상도 100% 배율
            - OBS Studio 28 이상 (실행해 둔 상태여야 합니다)
            - 한국어 OCR 언어 팩 — 한국어 윈도우에는 기본 포함

            ### 처음 쓰실 때
            1. OBS를 한 번 실행하고 자동 구성 마법사를 닫은 뒤 **OBS를 종료**합니다
            2. 이 프로그램을 실행하고 **설정 탭 → OBS websocket 서버 켜기**
            3. OBS를 다시 실행하고 **다시 시도**
            4. OBS에서 **소스 → + → 브라우저**, 주소는 상태 탭에 표시된 `http://127.0.0.1:8777/`
               (크기는 아무 값이나 넣으면 내용에 맞춰 자동 조정됩니다)

            크기 ${{ env.EXE_SIZE }} MB
          draft: false
          prerelease: ${{ startsWith(github.event.inputs.tag || github.ref_name, 'v0.') }}
