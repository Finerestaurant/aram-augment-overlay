name: Release

# Tag a version and the exe shows up on the release page:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The build is held to the parity suite first, so a tag cannot ship an exe that
# failed its own tests.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스로 만들 태그 (예: v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Parity self-test
        run: dotnet run --project src/AramOverlay.SelfTest -c Release -- ${{ github.workspace }}

      - name: Publish single file
        run: >
          dotnet publish src/AramOverlay.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/ARAM-Augment-Overlay.exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item publish/ARAM-Augment-Overlay.exe).Length / 1MB, 1)
          "SHA256: $hash" | Out-File publish/SHA256.txt -Encoding utf8
          "EXE_SHA256=$hash" | Out-File -Append $env:GITHUB_ENV
          "EXE_SIZE=$size"   | Out-File -Append $env:GITHUB_ENV

      - name: Release notes
        shell: pwsh
        run: |
          # The text people read on the release page lives in the repo rather
          # than in this file: it is four languages long, and a translation is
          # not something to review inside a YAML string. Per-version
          # highlights, when there are any, sit in docs/release-notes/<tag>.md
          # and go above the standing instructions.
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $parts = @()
          if (Test-Path "docs/release-notes/$tag.md") {
            $parts += (Get-Content "docs/release-notes/$tag.md" -Raw)
          }
          $parts += (Get-Content ".github/release-body.md" -Raw)
          $body = $parts -join "`n`n---`n`n"
          $body = $body.Replace('__SHA256__', $env:EXE_SHA256)
          $body = $body.Replace('__SIZE__', $env:EXE_SIZE)
          $body | Out-File release-notes.md -Encoding utf8

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            publish/ARAM-Augment-Overlay.exe
            publish/SHA256.txt
          body_path: release-notes.md
          draft: false
          # Pre-release is a decision about a tag, not about its major number.
          # Treating every v0.x as one meant unmarking each release by hand,
          # which is a step that gets forgotten rather than a safeguard. A
          # suffix says it instead: v0.4.0-rc1 is a pre-release, v0.4.0 is not.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
