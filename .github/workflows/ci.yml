name: CI

# Every push and PR gets built and held to the parity suite. The runners are
# English Windows images, so the Korean OCR pack is absent and the OCR
# comparison reports SKIP -- the rest still runs, including the detection
# thresholds, which is where a regression would actually hurt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/AramOverlay.slnx -c Release

      - name: Parity self-test
        run: dotnet run --project src/AramOverlay.SelfTest -c Release -- ${{ github.workspace }}

      - name: Publish
        run: >
          dotnet publish src/AramOverlay.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v7
        with:
          name: ARAM-Augment-Overlay
          path: publish/ARAM-Augment-Overlay.exe
          if-no-files-found: error
