<!doctype html>
<meta charset="utf-8">
<title>아수라장 증강</title>
<!--CONFIG-->
<style>
  /* Rarity colours measured off real capture frames rather than guessed: the
     card frame, the top band and the prismatic glyph's hologram. The old
     pastel set (b8c4d0 / e8c07a / d9a8e8) was invented before there was
     anything to measure against, and prismatic in particular read as "a
     slightly pink gold" on stream instead of the thing the game shows. */
  :root {
    --silver:      #7c8892;   /* frame */
    --silver-ink:  #98a4ae;   /* text on dark */
    --gold:        #e3cda7;
    --gold-ink:    #ede7d8;
    --prism-a: #f7d774; --prism-b: #8be9cf; --prism-c: #c99af5; --prism-d: #f7a8d8;
    --unknown:     #8a8f98;
    --holo: linear-gradient(135deg, var(--prism-a), var(--prism-b),
                            var(--prism-c), var(--prism-d));
    --ink: #f2f5f8;
  }
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* inline-flex so the box hugs its contents instead of filling the source --
     the tool reads the measured size back and resizes the OBS source to match.
     width:max-content keeps that measurement intrinsic: without it the cards
     would stretch to whatever the source is currently sized to, so a narrow
     source would measure narrow and ratchet itself smaller every frame. */
  #wrap { display: inline-flex; width: max-content; padding: 12px; }

  /* The icons ship as white line art and there is no coloured variant on the
     CDN, so the glyph is used as a mask and filled with the rarity colour. */
  .icon {
    flex: none; background: var(--unknown);
    -webkit-mask: var(--icon) center / contain no-repeat;
    mask: var(--icon) center / contain no-repeat;
  }
  .silver .icon    { background: var(--silver-ink); }
  .gold .icon      { background: var(--gold); }
  .prismatic .icon { background: var(--holo); }

  /* A slot held open so the box does not change size as picks arrive. A layout
     that grew a row at a time would shift everything around it mid-game.
     border-box because the sizes below are the whole slot: a card carries its
     own padding, and without this the held slot came out 16px taller than the
     real one it stands in for -- four rows measured 328 instead of 280. */
  .hold { visibility: hidden; box-sizing: border-box; }

  /* ── d · game palette ─────────────────────────────────────────────────────
     Today's layout, with the measured colours. The smallest change of the
     three and the one that still reads at a glance on a busy stream. */
  #wrap[data-theme="d"] { flex-direction: column; gap: 8px; min-width: 260px; }
  [data-theme="d"] .card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 8px 8px;
    background: rgba(8, 12, 20, .84);
    border-left: 4px solid var(--unknown);
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
    animation: slide-in .45s cubic-bezier(.2,.8,.3,1) both;
  }
  [data-theme="d"] .card.silver    { border-left-color: var(--silver-ink); }
  [data-theme="d"] .card.gold      { border-left-color: var(--gold); }
  /* border-image paints the hologram down the edge; the other three sides are
     removed rather than left transparent so nothing shifts by a pixel. */
  [data-theme="d"] .card.prismatic {
    border-left: 4px solid transparent;
    border-image: linear-gradient(180deg, var(--prism-a), var(--prism-b),
                                  var(--prism-c), var(--prism-d)) 1;
    border-right: 0; border-top: 0; border-bottom: 0;
  }
  [data-theme="d"] .icon { width: 42px; height: 42px; border-radius: 4px;
                           -webkit-mask-size: 36px; mask-size: 36px; }
  [data-theme="d"] .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  [data-theme="d"] .name {
    color: var(--ink); font-size: 17px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  [data-theme="d"] .sub { font-size: 12px; color: #9aa4b2; letter-spacing: .02em; }
  [data-theme="d"] .hold { height: 58px; width: 0; }

  /* ── b · HUD tray ─────────────────────────────────────────────────────────
     The game's own list of augments already taken, scaled up: a square glyph
     in a rarity frame with the name under it. Grows sideways, so it sits along
     the top or bottom edge of a layout and costs almost no vertical room. */
  #wrap[data-theme="b"] { flex-direction: row; gap: 10px; align-items: flex-start;
                          background: rgba(8, 13, 17, .78);
                          border: 1px solid rgba(227, 205, 167, .28);
                          border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  [data-theme="b"] .chip {
    display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px;
    animation: rise-in .45s cubic-bezier(.2,.8,.3,1) both;
  }
  [data-theme="b"] .sq {
    width: 48px; height: 48px; border-radius: 3px; background: #0b1216;
    border: 1.5px solid var(--unknown); display: grid; place-items: center;
    box-shadow: inset 0 0 12px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.6);
  }
  [data-theme="b"] .silver .sq { border-color: var(--silver); }
  [data-theme="b"] .gold .sq   { border-color: var(--gold); }
  [data-theme="b"] .prismatic .sq {
    border-color: transparent;
    background: linear-gradient(#0b1216, #0b1216) padding-box, var(--holo) border-box;
  }
  [data-theme="b"] .icon { width: 40px; height: 40px;
                           -webkit-mask-size: 34px; mask-size: 34px; }
  [data-theme="b"] .nm {
    font-size: 11.5px; line-height: 1.25; font-weight: 500; color: var(--gold-ink);
    text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  [data-theme="b"] .hold { width: 84px; height: 78px; }

  /* ── c · one strip ────────────────────────────────────────────────────────
     Everything on one 40px line in a single glass pill: glyph, name, a rarity
     dot. The lightest of the three and the closest to broadcast convention.
     There is nowhere to put a level, so it does not show one. */
  #wrap[data-theme="c"] { flex-direction: row; }
  [data-theme="c"] .strip {
    display: inline-flex; align-items: center; height: 40px; padding: 0 6px;
    border-radius: 20px; background: rgba(8, 13, 17, .72);
    backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  [data-theme="c"] .it {
    display: flex; align-items: center; gap: 8px; height: 40px;
    padding: 0 14px 0 8px; position: relative;
    animation: fade-in .45s ease both;
  }
  [data-theme="c"] .it + .it::before {
    content: ""; position: absolute; left: 0; top: 11px; bottom: 11px;
    width: 1px; background: rgba(255,255,255,.12);
  }
  [data-theme="c"] .icon { width: 26px; height: 26px;
                           -webkit-mask-size: 22px; mask-size: 22px; }
  [data-theme="c"] .nm {
    font-size: 13.5px; font-weight: 500; color: #f1eee6; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  [data-theme="c"] .dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: var(--unknown); box-shadow: 0 0 6px var(--unknown);
  }
  [data-theme="c"] .silver .dot { background: var(--silver-ink); box-shadow: 0 0 6px var(--silver-ink); }
  [data-theme="c"] .gold .dot   { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  [data-theme="c"] .prismatic .dot {
    background: linear-gradient(135deg, var(--prism-a), var(--prism-c));
    box-shadow: 0 0 6px var(--prism-c);
  }
  [data-theme="c"] .hold { width: 130px; height: 40px; }

  /* Only visible while a pointer is over the widget. A stream has no cursor
     here, so it stays hidden on air; OBS's "상호작용" window gives you one. */
  #reset {
    position: fixed; top: 6px; right: 6px;
    opacity: 0; transition: opacity .12s;
    background: rgba(180, 40, 40, .92); color: #fff;
    border: 0; border-radius: 5px; padding: 5px 10px;
    font: 600 12px/1 "Malgun Gothic", system-ui, sans-serif;
    cursor: pointer;
  }
  body:hover #reset { opacity: 1; }
  #reset:active { background: rgba(140, 28, 28, .95); }

  @keyframes slide-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes rise-in  { from { opacity: 0; transform: translateY(10px); }  to { opacity: 1; transform: none; } }
  @keyframes fade-in  { from { opacity: 0; }                               to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .card, .chip, .it { animation: none !important; }
  }
</style>
<div id="wrap" data-theme="d"></div>
<button id="reset"></button>
<script>
  // Labels come from the app, so the overlay speaks the same language as the
  // window it is driven from.
  const CFG = window.__CFG__ || {};
  const T = CFG.text || {};
  const RARITY = {
    silver: T.silver || "실버", gold: T.gold || "골드",
    prismatic: T.prismatic || "프리즘", unknown: T.unknown || "미상",
  };
  const THEMES = ["b", "c", "d"];
  const wrap = document.getElementById("wrap");
  const resetButton = document.getElementById("reset");
  resetButton.textContent = T.reset || "초기화";
  resetButton.title = T.resetTitle || "증강 목록 비우기";

  // How many slots the box holds open. Rows down the screen in theme d, columns
  // across it in b and c -- the same setting, because it means the same thing:
  // how many picks fit before the box would have to change size.
  const SLOTS = Math.max(1, CFG.rows || 4);
  let theme = THEMES.includes(CFG.theme) ? CFG.theme : "d";
  let lastKey = "";

  function iconOf(pick) {
    const el = document.createElement("div");
    el.className = "icon";
    if (pick && pick.icon_url) el.style.setProperty("--icon", `url("${pick.icon_url}")`);
    return el;
  }

  function rarityWord(pick) {
    return RARITY[pick.rarity] || RARITY.unknown;
  }

  // One pick, in whichever shape the chosen theme wants. A null pick is a slot
  // held open: the same element, hidden, so it takes up exactly the room a real
  // one would.
  function cardFor(pick) {
    const rarity = pick ? (pick.rarity || "unknown") : "unknown";
    let el;
    if (theme === "b") {
      el = document.createElement("div");
      el.className = "chip " + rarity;
      const sq = document.createElement("div");
      sq.className = "sq";
      sq.appendChild(iconOf(pick));
      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = pick ? pick.name : "";
      el.append(sq, nm);
    } else if (theme === "c") {
      el = document.createElement("div");
      el.className = "it " + rarity;
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = pick ? pick.name : "";
      const dot = document.createElement("span");
      dot.className = "dot";
      el.append(iconOf(pick), nm, dot);
    } else {
      el = document.createElement("div");
      el.className = "card " + rarity;
      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = pick ? pick.name : "";
      const sub = document.createElement("div");
      sub.className = "sub";
      if (pick) {
        const r = document.createElement("span");
        r.style.color = "var(--" + (rarity === "silver" ? "silver-ink"
                                  : rarity === "gold" ? "gold"
                                  : rarity === "prismatic" ? "prism-c" : "unknown") + ")";
        r.textContent = rarityWord(pick);
        sub.appendChild(r);
        if (pick.level) {
          // withLevel is "{0} · <level>", so the rarity span stays a span and
          // only the text either side of it is swapped per language.
          const parts = (T.withLevel || "{0} · {1}레벨").split("{0}");
          r.insertAdjacentText("beforebegin", parts[0] || "");
          sub.append((parts[1] || "").replace("{1}", pick.level));
        }
      }
      meta.append(name, sub);
      el.append(iconOf(pick), meta);
    }
    if (!pick) el.classList.add("hold");
    return el;
  }

  function render(picks) {
    const key = theme + "|" + JSON.stringify(picks.map(p => [p.name, p.rarity, p.level]));
    if (key === lastKey) return;
    lastKey = key;
    wrap.dataset.theme = theme;
    wrap.innerHTML = "";
    if (CFG.maxWidth && theme === "d") wrap.style.maxWidth = CFG.maxWidth + "px";
    else wrap.style.maxWidth = "";

    const slots = [];
    for (let i = 0; i < Math.max(SLOTS, picks.length); i++)
      slots.push(cardFor(picks[i] || null));

    // Theme c puts everything inside one pill, so the slots go in there rather
    // than straight into the box.
    if (theme === "c") {
      const strip = document.createElement("div");
      strip.className = "strip";
      strip.append(...slots);
      wrap.appendChild(strip);
    } else {
      wrap.append(...slots);
    }
  }

  // The box is measured, not calculated. Every theme holds its slots open, so
  // what is on screen is already the full size and the OBS source can be told
  // to match it -- no per-theme arithmetic to keep in step with the CSS.
  let sentW = 0, sentH = 0;
  function reportSize() {
    const box = wrap.getBoundingClientRect();
    const w = Math.ceil(box.width), h = Math.ceil(box.height);
    if (!w || !h || (w === sentW && h === sentH)) return;
    sentW = w; sentH = h;
    fetch("/size", {method: "POST", body: JSON.stringify({w, h})}).catch(() => {});
  }

  async function tick() {
    try {
      const r = await fetch("/state.json", { cache: "no-store" });
      const s = await r.json();
      // The theme is served with the state rather than baked into the page, so
      // choosing one in the app shows up here within a poll instead of needing
      // the browser source reloaded.
      if (THEMES.includes(s.theme) && s.theme !== theme) theme = s.theme;
      render(s.picks || []);
      requestAnimationFrame(reportSize);   // 비어 있어도 보고해 박스를 유지
    } catch (e) { /* server not up yet; keep the last frame */ }
  }
  resetButton.addEventListener("click", async () => {
    try {
      const r = await fetch("/reset", { method: "POST" });
      const s = await r.json();
      lastKey = "";            // force a repaint even if the list was empty
      render(s.picks || []);
    } catch (e) { /* server gone; the poll below will catch up */ }
  });

  render([]);
  tick();
  setInterval(tick, 1000);
</script>
