<!doctype html>
<meta charset="utf-8">
<title>아수라장 증강</title>
<!--CONFIG-->
<style>
  :root {
    --silver: #b8c4d0;
    --gold:   #e8c07a;
    --prism:  #d9a8e8;
    --unknown:#8a8f98;
  }
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* inline-flex so the box hugs its contents instead of filling the source --
     the tool reads the measured size back and resizes the OBS source to match.
     width:max-content keeps that measurement intrinsic: without it the cards
     would stretch to whatever the source is currently sized to, so a narrow
     source would measure narrow and ratchet itself smaller every frame. */
  #wrap { display: inline-flex; flex-direction: column; gap: 8px; padding: 12px;
          width: max-content; max-width: 420px; }
  .card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px 8px 8px;
    background: rgba(8, 12, 20, .82);
    border-left: 4px solid var(--unknown);
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
    animation: in .45s cubic-bezier(.2,.8,.3,1) both;
  }
  .card.silver    { border-left-color: var(--silver); }
  .card.gold      { border-left-color: var(--gold); }
  .card.prismatic { border-left-color: var(--prism); }
  /* The icons ship as white line art and there is no coloured variant on the
     CDN, so the glyph is used as a mask and filled with the rarity colour. */
  .icon {
    width: 42px; height: 42px; flex: none; border-radius: 4px;
    background: var(--unknown);
    -webkit-mask: var(--icon) center / 38px 38px no-repeat;
    mask: var(--icon) center / 38px 38px no-repeat;
  }
  .card.silver    .icon { background: var(--silver); }
  .card.gold      .icon { background: var(--gold); }
  .card.prismatic .icon { background: var(--prism); }
  .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name {
    color: #f2f5f8; font-size: 17px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,.7);
  }
  .sub { font-size: 12px; color: #9aa4b2; letter-spacing: .02em; }
  .sub .r-silver    { color: var(--silver); }
  .sub .r-gold      { color: var(--gold); }
  .sub .r-prismatic { color: var(--prism); }
  /* Only visible while a pointer is over the widget. A stream has no cursor
     here, so it stays hidden on air; OBS's "상호작용" window gives you one. */
  #reset {
    position: fixed; top: 6px; right: 6px;
    opacity: 0; transition: opacity .12s;
    background: rgba(180, 40, 40, .92); color: #fff;
    border: 0; border-radius: 5px; padding: 5px 10px;
    font: 600 12px/1 "Malgun Gothic", system-ui, sans-serif;
    cursor: pointer;
  }
  body:hover #reset { opacity: 1; }
  #reset:active { background: rgba(140, 28, 28, .95); }
  @keyframes in {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: none; }
  }
</style>
<div id="wrap"></div>
<button id="reset"></button>
<script>
  // Labels come from the app, so the overlay speaks the same language as the
  // window it is driven from.
  const CFG = window.__CFG__ || {};
  const T = CFG.text || {};
  const RARITY = {
    silver: T.silver || "실버", gold: T.gold || "골드",
    prismatic: T.prismatic || "프리즘", unknown: T.unknown || "미상",
  };
  const wrap = document.getElementById("wrap");
  const resetButton = document.getElementById("reset");
  resetButton.textContent = T.reset || "초기화";
  resetButton.title = T.resetTitle || "증강 목록 비우기";
  let lastKey = "";

  function render(picks) {
    const key = JSON.stringify(picks.map(p => [p.name, p.rarity]));
    if (key === lastKey) return;
    lastKey = key;
    wrap.innerHTML = "";
    if (!picks.length) return;      // 아무것도 없으면 아무것도 그리지 않는다
    for (const p of picks) {
      const el = document.createElement("div");
      el.className = "card " + (p.rarity || "unknown");
      const img = document.createElement("div");
      img.className = "icon";
      if (p.icon_url) img.style.setProperty("--icon", `url("${p.icon_url}")`);
      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.name;
      const sub = document.createElement("div");
      sub.className = "sub";
      const r = document.createElement("span");
      r.className = "r-" + (p.rarity || "unknown");
      r.textContent = RARITY[p.rarity] || RARITY.unknown;
      sub.appendChild(r);
      if (p.level) {
        // withLevel is "{0} · <level>", so the rarity span stays a span and
        // only the text either side of it is swapped per language.
        const parts = (T.withLevel || "{0} · {1}레벨").split("{0}");
        r.insertAdjacentText("beforebegin", parts[0] || "");
        sub.append((parts[1] || "").replace("{1}", p.level));
      }
      meta.append(name, sub);
      el.append(img, meta);
      wrap.appendChild(el);
    }
  }

  // Width follows the cards, height is held at ROWS rows. A fixed 420-wide box
  // left a wide transparent strip on the right that made the source awkward to
  // place against a stream layout; the height stays fixed because a box that
  // grew a row at a time would shift the layout mid-game. The last card width
  // is kept while the list is empty so the box does not collapse to its padding
  // and become fiddly to grab in OBS before going live.
  const ROWS = CFG.rows || 4, PAD = 12, GAP = 8, CARD_H = 58, EMPTY_W = 260;
  if (CFG.maxWidth) wrap.style.maxWidth = CFG.maxWidth + "px";
  let sentW = 0, sentH = 0, lastCardW = 0;
  function reportSize() {
    const first = wrap.firstElementChild;
    const box = first ? first.getBoundingClientRect() : null;
    const cardH = box ? Math.round(box.height) || CARD_H : CARD_H;
    if (box && box.width) lastCardW = Math.ceil(box.width);
    const w = (lastCardW || EMPTY_W) + PAD * 2;
    const h = PAD * 2 + ROWS * cardH + (ROWS - 1) * GAP;
    if (w === sentW && h === sentH) return;
    sentW = w; sentH = h;
    fetch("/size", {method: "POST", body: JSON.stringify({w, h})}).catch(() => {});
  }

  async function tick() {
    try {
      const r = await fetch("/state.json", { cache: "no-store" });
      const s = await r.json();
      render(s.picks || []);
      requestAnimationFrame(reportSize);   // 비어 있어도 보고해 박스를 유지
    } catch (e) { /* server not up yet; keep the last frame */ }
  }
  document.getElementById("reset").addEventListener("click", async () => {
    try {
      const r = await fetch("/reset", { method: "POST" });
      const s = await r.json();
      lastKey = "";            // force a repaint even if the list was empty
      render(s.picks || []);
    } catch (e) { /* server gone; the poll below will catch up */ }
  });

  tick();
  setInterval(tick, 1000);
</script>
