<!doctype html>
<meta charset="utf-8">
<title>판정 검사</title>
<style>
  /* Dark only, on purpose: this page is a developer tool that runs beside a
     game capture, and a light theme beside game frames is unreadable. The
     series hues are the validated dark steps, checked against --panel as the
     chart surface rather than assumed from the light set. */
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262c36;
    --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5;  /* L / 카드 간 비율 축의 첫 슬롯 */
    --s2: #d95926;  /* M */
    --s3: #199e70;  /* R */
    --s4: #9085e9;  /* 카드 간 비율 */
    --s5: #c98500;  /* 자기 기준선 대비 */
    --s6: #d55181;  /* 호버 비율 */
    --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink2);
         font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 10px 16px;
           display: flex; align-items: center; gap: 14px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--good); }
  button { background: var(--panel); color: var(--ink2); border: 1px solid var(--line);
           border-radius: 5px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--s1); color: var(--ink); }
  button[aria-pressed="true"] { border-color: var(--s1); color: var(--ink); }
  .muted { color: var(--muted); }
  main { padding: 16px; display: flex; flex-direction: column; gap: 18px; }

  .win { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .win.disputed { border-color: var(--warn); }
  .win.abandoned { border-color: var(--bad); }
  .head { padding: 10px 14px; display: flex; align-items: baseline; gap: 10px;
          flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .tag { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
         font-size: 11px; color: var(--muted); }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  .tag.bad { border-color: var(--bad); color: var(--bad); }
  .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }

  table.sig { border-collapse: collapse; font-size: 12px; }
  table.sig td { padding: 2px 12px 2px 0; vertical-align: top; }
  table.sig td.k { color: var(--muted); white-space: nowrap; }
  .won { color: var(--ink); }
  .lost { color: var(--muted); }

  /* ---- player ---- */
  .player { display: flex; gap: 12px; flex-wrap: wrap; }
  .stage { flex: 1 1 520px; min-width: 320px; }
  .stage img { width: 100%; display: block; border-radius: 6px; background: #000;
               border: 2px solid var(--line); cursor: zoom-in; }
  .stage img.decided { border-color: var(--bad); }
  .stage img.passes { border-color: var(--warn); }
  .transport { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .transport input[type=range] { flex: 1; accent-color: var(--s1); }
  .now { font: 12px/1 ui-monospace, Consolas, monospace; color: var(--ink);
         font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stills { flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px; }
  .stills figure { margin: 0; }
  .stills img { width: 100%; display: block; border-radius: 4px; background: #000;
                border: 1px solid var(--line); cursor: zoom-in; }
  figcaption { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ---- charts ---- */
  .chart { position: relative; }
  .chart h3 { font-size: 12px; font-weight: 600; color: var(--ink2);
              margin: 0 0 2px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px;
            color: var(--muted); margin-bottom: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 12px; height: 2px; border-radius: 1px; }
  .swatch.dash { height: 0; border-top: 2px dashed var(--muted); }
  .tip { position: absolute; pointer-events: none; background: #0b0e13ee;
         border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px;
         font: 11px/1.5 ui-monospace, Consolas, monospace; color: var(--ink2);
         white-space: pre; display: none; z-index: 3; font-variant-numeric: tabular-nums; }

  /* ---- folds ---- */
  .sec { display: flex; flex-direction: column; gap: 6px; }
  .sec > .bar { display: flex; align-items: center; gap: 8px; }
  .sec > .bar h3 { font-size: 12px; font-weight: 600; color: var(--ink2); margin: 0; }
  button.fold { padding: 0 6px; line-height: 18px; color: var(--muted);
                font: 11px/18px ui-monospace, Consolas, monospace; }
  button.fold::before { content: "\25BE"; }
  button.fold[aria-expanded="false"]::before { content: "\25B8"; }
  .folded { display: none !important; }
  .head button.fold { margin-right: 2px; }

  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre.why { margin: 6px 0 0; white-space: pre-wrap; color: var(--muted);
            font: 12px/1.5 ui-monospace, Consolas, monospace; }
  table.data { border-collapse: collapse; font: 11px/1.4 ui-monospace, Consolas, monospace;
               margin-top: 8px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { border: 1px solid var(--line); padding: 2px 6px;
                                 text-align: right; }
  table.data th { color: var(--muted); font-weight: 600; }
  table.data tr.decided td { color: var(--bad); }

  #shade { position: fixed; inset: 0; background: #000d; display: none;
           align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
  #shade img { max-width: 96vw; max-height: 96vh; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>

<header>
  <span class="dot" id="dot"></span>
  <h1>판정 검사</h1>
  <span class="muted" id="count"></span>
  <span style="flex:1"></span>
  <button id="foldall">전부 접기</button>
  <button id="clear">비우기</button>
</header>

<main id="out"><div class="empty">증강 선택창을 기다리는 중...</div></main>
<div id="shade"><img id="big" alt=""></div>

<script>
const out = document.getElementById('out');
const dot = document.getElementById('dot');
const count = document.getElementById('count');
const shade = document.getElementById('shade');
const big = document.getElementById('big');
let seen = -1, limits = null;
const players = new Map();

// Which sections are folded, keyed by "<window id>|<part>". Kept outside the
// render so a new window arriving mid-inspection does not unfold everything
// that was deliberately put away; window ids are stable for the life of the
// ring, so the keys stay valid across redraws.
const folded = new Set();

function foldBtn(key, label) {
  const shut = folded.has(key);
  return `<button class="fold" data-fold="${key}" aria-expanded="${!shut}"
           aria-label="${esc(label)} 접기/펼치기" title="${esc(label)} 접기/펼치기"></button>`;
}
const foldCls = key => folded.has(key) ? ' folded' : '';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fx = (n, d = 2) => (n == null || !isFinite(n)) ? '-' : n.toFixed(d);

// The ratio the hover-glow test runs on: top card mean over the next one. Held
// here rather than on the server because it is the same numbers seen a second
// way, and a second copy would be one more thing to keep in step.
function hoverRatio(f) {
  const v = Object.values(f.mean || {}).sort((a, b) => b - a);
  return (v.length > 1 && v[1] > 0) ? v[0] / v[1] : 0;
}

/* ---------------------------------------------------------------- charts */
const W = 900, H = 190, PAD = { l: 44, r: 96, t: 10, b: 22 };

// One time-series panel. Thresholds are rules with their own direct labels, in
// muted ink -- they are not series and must not read as one.
function chart(id, kind, frames, series, thresholds, yMaxHint) {
  if (!frames.length) return '';
  const ts = frames.map(f => f.t);
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const span = (t1 - t0) || 1;
  let yMax = yMaxHint;
  for (const s of series) for (const f of frames) yMax = Math.max(yMax, s.get(f));
  for (const th of thresholds) yMax = Math.max(yMax, th.v);
  yMax = yMax * 1.12 || 1;

  const px = t => PAD.l + (t - t0) / span * (W - PAD.l - PAD.r);
  const py = v => H - PAD.b - (v / yMax) * (H - PAD.t - PAD.b);

  const ticks = [];
  const step = yMax > 120 ? 50 : yMax > 8 ? 2 : yMax > 3 ? 1 : 0.5;
  for (let v = 0; v <= yMax; v += step) ticks.push(v);

  let g = '';
  for (const v of ticks)
    g += `<line x1="${PAD.l}" y1="${py(v).toFixed(1)}" x2="${W - PAD.r}" y2="${py(v).toFixed(1)}"
           stroke="var(--grid)" stroke-width="1"/>
          <text x="${PAD.l - 6}" y="${(py(v) + 3.5).toFixed(1)}" text-anchor="end"
           font-size="10" fill="var(--muted)">${v % 1 ? v.toFixed(1) : v}</text>`;

  // The stretch the flare search can reach. A verdict taken from outside it is
  // the failure this page exists to make visible, so the range is drawn rather
  // than described.
  const inw = frames.filter(f => f.in_window);
  if (inw.length) {
    const a = px(inw[0].t), b = px(inw[inw.length - 1].t);
    g += `<rect x="${a.toFixed(1)}" y="${PAD.t}" width="${(b - a).toFixed(1)}"
           height="${H - PAD.t - PAD.b}" fill="var(--s1)" opacity="0.07"/>`;
  }
  // Anchor: the last frame the cards were still up.
  g += `<line x1="${px(0)}" y1="${PAD.t}" x2="${px(0)}" y2="${H - PAD.b}"
         stroke="var(--axis)" stroke-width="1" stroke-dasharray="2 3"/>`;

  for (const th of thresholds) {
    const y = py(th.v);
    g += `<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${W - PAD.r}" y2="${y.toFixed(1)}"
           stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
          <text x="${W - PAD.r + 6}" y="${(y + 3.5).toFixed(1)}" font-size="10"
           fill="var(--muted)">${esc(th.label)}</text>`;
  }

  // Frames with no cards on screen. Marked on the axis because "the cards were
  // already gone" is the single most useful thing to know about a frame.
  let ribbon = '';
  for (const f of frames)
    if (!f.cards_up)
      ribbon += `<rect x="${(px(f.t) - 3).toFixed(1)}" y="${H - PAD.b + 3}" width="6" height="4"
                  fill="var(--bad)" opacity="0.75"/>`;

  let paths = '';
  for (const s of series) {
    const pts = frames.map(f => `${px(f.t).toFixed(1)},${py(s.get(f)).toFixed(1)}`);
    paths += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}"
               stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = frames[frames.length - 1];
    paths += `<text x="${(px(last.t) + 6).toFixed(1)}" y="${(py(s.get(last)) + 3.5).toFixed(1)}"
               font-size="10" fill="${s.color}">${esc(s.label)}</text>`;
  }

  // The frame the search settled on, called out on the plot itself.
  const dec = frames.find(f => f.decided);
  let mark = '';
  if (dec)
    mark = `<line x1="${px(dec.t)}" y1="${PAD.t}" x2="${px(dec.t)}" y2="${H - PAD.b}"
             stroke="var(--bad)" stroke-width="2"/>
            <text x="${px(dec.t)}" y="${PAD.t + 9}" font-size="10" fill="var(--bad)"
             text-anchor="middle">판정</text>`;

  const label = kind === 'inner' ? '카드 내부 밝기' : '판정 축 (비율)';
  const key = `${id}|chart-${kind}`;
  return `<div class="sec">
    <div class="bar">${foldBtn(key, label)}<h3>${label}</h3></div>
    <div class="chart${foldCls(key)}" data-fold-body="${key}" data-chart="${id}" data-kind="${kind}">
    <div class="legend">
      ${series.map(s => `<span><i class="swatch" style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}
      ${thresholds.map(t => `<span><i class="swatch dash"></i>${esc(t.label)}</span>`).join('')}
      <span><i class="swatch" style="background:var(--s1);opacity:.35"></i>플레어 탐색 범위</span>
      <span><i class="swatch" style="background:var(--bad)"></i>카드 없음 / 판정 프레임</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind === 'inner' ? '카드 내부 밝기' : '판정 축'} 시계열">
      ${g}${ribbon}${paths}${mark}
      <line x1="${PAD.l}" y1="${H - PAD.b}" x2="${W - PAD.r}" y2="${H - PAD.b}"
            stroke="var(--axis)" stroke-width="1"/>
      <text x="${PAD.l}" y="${H - 6}" font-size="10" fill="var(--muted)">${fx(t0, 1)}s</text>
      <text x="${px(0)}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="middle">앵커</text>
      <text x="${W - PAD.r}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="end">+${fx(t1, 1)}s</text>
      <line class="playhead" x1="0" y1="${PAD.t}" x2="0" y2="${H - PAD.b}"
            stroke="var(--ink)" stroke-width="1" opacity="0"/>
    </svg>
    <div class="tip"></div>
  </div></div>`;
}

/* ------------------------------------------------------------ one window */
function signal(label, slot, text, winner) {
  const won = slot && slot === winner;
  return `<tr><td class="k">${label}</td>` +
         `<td class="${won ? 'won' : 'lost'}">${esc(text)}${won ? '  &lt;- 채택' : ''}</td></tr>`;
}

function windowCard(w) {
  const strip = w.frames.filter(f => f.tag === 'strip');
  const stills = w.frames.filter(f => f.tag !== 'strip');
  const cls = w.abandoned ? 'abandoned' : (w.disputed ? 'disputed' : '');
  const title = w.abandoned
    ? `<span class="name">기록 안 됨</span><span class="tag bad">${esc(w.abandoned)}</span>`
    : `<span class="name">${esc(w.name)}</span>` +
      `<span class="tag">${esc(w.rarity)}</span><span class="tag">${esc(w.slot)} 카드</span>`;
  const others = Object.entries(w.cards).map(([k, v]) => `${k}=${v}`).join(', ');

  const slots = ['L', 'M', 'R'].filter(s => strip.some(f => f.inner && s in f.inner));
  const hues = { L: 'var(--s1)', M: 'var(--s2)', R: 'var(--s3)' };
  const innerSeries = slots.map(s => ({ label: s, color: hues[s], get: f => f.inner[s] ?? 0 }));
  const axisSeries = [
    { label: '카드 간 비율', color: 'var(--s4)', get: f => f.ratio },
    { label: '자기 기준선 대비', color: 'var(--s5)', get: f => f.rise },
    { label: '호버 비율', color: 'var(--s6)', get: f => hoverRatio(f) },
  ];
  // Both flare axes share a threshold; drawing it twice would put two rules on
  // one line and read as a bug.
  const th = [];
  if (limits) {
    if (limits.ratio === limits.rise) th.push({ v: limits.ratio, label: `플레어 임계 ${limits.ratio}` });
    else { th.push({ v: limits.ratio, label: `비율 ${limits.ratio}` }, { v: limits.rise, label: `상승 ${limits.rise}` }); }
    th.push({ v: limits.hover, label: `호버 임계 ${limits.hover}` });
  }

  const charts = strip.length
    ? chart(w.id, 'inner', strip, innerSeries, [], 0) +
      chart(w.id, 'axis', strip, axisSeries, th, 0)
    : '';

  const pKey = `${w.id}|player`;
  const player = strip.length ? `
    <div class="sec">
    <div class="bar">${foldBtn(pKey, '재생')}<h3>재생 · ${strip.length}프레임</h3></div>
    <div class="player${foldCls(pKey)}" data-fold-body="${pKey}">
      <div class="stage">
        <img id="${w.id}-img" src="/frame/${strip[0].id}.img" alt="판정 프레임">
        <div class="transport">
          <button data-act="step" data-d="-1" aria-label="이전 프레임">&#9668;</button>
          <button data-act="play" aria-label="재생">&#9654; 재생</button>
          <button data-act="step" data-d="1" aria-label="다음 프레임">&#9658;</button>
          <input type="range" min="0" max="${strip.length - 1}" value="0" data-act="seek">
          <button data-act="speed" data-v="1" aria-pressed="true">1x</button>
          <button data-act="speed" data-v="0.25" aria-pressed="false">0.25x</button>
        </div>
        <div class="now" id="${w.id}-now"></div>
      </div>
      <div class="stills">
        ${stills.map(f => `<figure><img src="/frame/${f.id}.img" alt="${esc(f.tag)}">
          <figcaption>${f.tag === 'read' ? '제목을 읽은 프레임' : '마지막 alive 프레임'}</figcaption></figure>`).join('')}
      </div>
    </div></div>` : '';

  const rows = strip.map(f => `<tr class="${f.decided ? 'decided' : ''}">
      <td>${fx(f.t)}</td>${slots.map(s => `<td>${fx(f.inner[s], 1)}</td>`).join('')}
      <td>${fx(f.ratio)}</td><td>${fx(f.rise)}</td><td>${fx(hoverRatio(f))}</td>
      <td>${f.cards_up ? '예' : '아니오'}</td><td>${f.passes ? '통과' : ''}</td></tr>`).join('');

  const bKey = `${w.id}|body`;
  const sKey = `${w.id}|signals`;
  return `<section class="win ${cls}" data-win="${w.id}">
    <div class="head">
      ${foldBtn(bKey, '창 전체')}
      ${title}
      ${w.level != null ? `<span class="tag">레벨 ${w.level}</span>` : ''}
      ${w.disputed ? '<span class="tag warn">신호 불일치</span>' : ''}
      <span style="flex:1"></span><span class="muted">${esc(w.at)}</span>
    </div>
    <div class="body${foldCls(bKey)}" data-fold-body="${bKey}">
      <div class="sec">
      <div class="bar">${foldBtn(sKey, '신호')}<h3>신호</h3></div>
      <table class="sig${foldCls(sKey)}" data-fold-body="${sKey}">
        ${signal('플레어', w.flare_slot, w.flare, w.slot)}
        ${signal('툴팁', w.tooltip_slot, w.tooltip, w.slot)}
        ${signal('호버', w.glow_slot, w.glow, w.slot)}
        ${others ? `<tr><td class="k">카드</td><td class="lost">${esc(others)}</td></tr>` : ''}
        ${w.rerolls.map(r => `<tr><td class="k">리롤</td><td class="lost">${esc(r)}</td></tr>`).join('')}
      </table></div>
      ${player}${charts}
      <details><summary>판정 근거 ${w.why.length}줄 · 측정값 표 ${strip.length}행</summary>
        <pre class="why">${esc(w.why.join('\n'))}</pre>
        ${strip.length ? `<table class="data"><thead><tr><th>t</th>
          ${slots.map(s => `<th>inner ${s}</th>`).join('')}
          <th>비율</th><th>상승</th><th>호버</th><th>카드</th><th>축</th></tr></thead>
          <tbody>${rows}</tbody></table>` : ''}
      </details>
    </div>
  </section>`;
}

/* ------------------------------------------------------------- playback */
function mount(w) {
  const strip = w.frames.filter(f => f.tag === 'strip');
  if (!strip.length) return;
  const root = out.querySelector(`[data-win="${w.id}"]`);
  const img = root.querySelector(`#${w.id}-img`);
  const now = root.querySelector(`#${w.id}-now`);
  const range = root.querySelector('[data-act=seek]');
  const playBtn = root.querySelector('[data-act=play]');
  const heads = root.querySelectorAll('.playhead');
  const charts = root.querySelectorAll('.chart');

  const st = { i: 0, speed: 1, timer: null };
  players.set(w.id, st);

  // Preloaded so scrubbing does not flash: the frames are already in memory on
  // the server and a stall here reads as a dropped frame.
  strip.forEach(f => { const p = new Image(); p.src = `/frame/${f.id}.img`; });

  const t0 = Math.min(...strip.map(f => f.t));
  const t1 = Math.max(...strip.map(f => f.t));
  const span = (t1 - t0) || 1;

  function show(i) {
    st.i = Math.max(0, Math.min(strip.length - 1, i));
    const f = strip[st.i];
    img.src = `/frame/${f.id}.img`;
    img.className = f.decided ? 'decided' : (f.passes ? 'passes' : '');
    range.value = st.i;
    now.textContent =
      `${f.t >= 0 ? '+' : ''}${fx(f.t)}s   ${st.i + 1}/${strip.length}   ` +
      `비율 ${fx(f.ratio)}  상승 ${fx(f.rise)}  호버 ${fx(hoverRatio(f))}` +
      `${f.cards_up ? '' : '   [카드 없음]'}${f.decided ? '   [이 프레임으로 판정]' : ''}`;
    const x = PAD.l + (f.t - t0) / span * (W - PAD.l - PAD.r);
    heads.forEach(h => { h.setAttribute('x1', x); h.setAttribute('x2', x); h.setAttribute('opacity', '1'); });
  }

  function stop() {
    clearTimeout(st.timer); st.timer = null;
    playBtn.innerHTML = '&#9654; 재생';
  }
  function play() {
    playBtn.innerHTML = '&#10073;&#10073; 일시정지';
    const tick = () => {
      if (st.i >= strip.length - 1) { show(0); }
      else show(st.i + 1);
      // Real capture spacing, so 1x plays back at the speed it happened.
      const cur = strip[st.i], next = strip[Math.min(st.i + 1, strip.length - 1)];
      const dt = Math.max(30, (next.t - cur.t) * 1000) / st.speed;
      st.timer = setTimeout(tick, dt);
    };
    st.timer = setTimeout(tick, 120);
  }

  st.stop = stop;

  root.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || !root.contains(b)) return;
    const act = b.dataset.act;
    if (!act) return;
    if (act === 'play') { st.timer ? stop() : play(); }
    else if (act === 'step') { stop(); show(st.i + Number(b.dataset.d)); }
    else if (act === 'speed') {
      st.speed = Number(b.dataset.v);
      root.querySelectorAll('[data-act=speed]').forEach(o =>
        o.setAttribute('aria-pressed', String(o === b)));
    }
  });
  range.addEventListener('input', () => { stop(); show(Number(range.value)); });

  // Crosshair on the charts, and a click seeks the player there: the chart and
  // the picture are two views of one frame and should navigate as one.
  charts.forEach(c => {
    const svg = c.querySelector('svg');
    const tip = c.querySelector('.tip');
    const nearest = ev => {
      const r = svg.getBoundingClientRect();
      const t = t0 + ((ev.clientX - r.left) / r.width * W - PAD.l) / (W - PAD.l - PAD.r) * span;
      let best = 0;
      strip.forEach((f, i) => {
        if (Math.abs(f.t - t) < Math.abs(strip[best].t - t)) best = i;
      });
      return best;
    };
    svg.addEventListener('mousemove', ev => {
      const f = strip[nearest(ev)];
      const r = c.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(r.width - 190, ev.clientX - r.left + 12) + 'px';
      tip.style.top = (ev.clientY - r.top + 12) + 'px';
      tip.textContent =
        `${f.t >= 0 ? '+' : ''}${fx(f.t)}s\n` +
        Object.entries(f.inner).map(([k, v]) => `inner ${k}  ${fx(v, 1)}`).join('\n') +
        `\n비율  ${fx(f.ratio)}\n상승  ${fx(f.rise)}\n호버  ${fx(hoverRatio(f))}` +
        `\n카드  ${f.cards_up ? '보임' : '없음'}`;
    });
    svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    svg.addEventListener('click', ev => { stop(); show(nearest(ev)); });
  });

  // Open on the frame that decided it -- the one worth looking at first.
  const dec = strip.findIndex(f => f.decided);
  show(dec >= 0 ? dec : 0);
}

/* --------------------------------------------------------------- render */
function render(windows) {
  players.forEach(p => clearTimeout(p.timer));
  players.clear();
  if (!windows.length) {
    out.innerHTML = '<div class="empty">증강 선택창을 기다리는 중...</div>';
    count.textContent = '';
    return;
  }
  count.textContent = `창 ${windows.length}개`;
  out.innerHTML = windows.map(windowCard).join('');
  windows.forEach(mount);
}

async function tick() {
  try {
    const v = await (await fetch('/version', { cache: 'no-store' })).json();
    dot.classList.add('on');
    if (v.version !== seen) {
      const data = await (await fetch('/windows.json', { cache: 'no-store' })).json();
      seen = data.version;
      limits = data.limits;
      render(data.windows);
    }
  } catch {
    dot.classList.remove('on');
  }
}

// One delegated handler for every fold button on the page. Folding the player
// stops it: a hidden video that is still advancing burns frames and, worse,
// keeps dragging the playheads on charts that are still visible.
function applyFold(key) {
  const shut = folded.has(key);
  out.querySelectorAll(`[data-fold-body="${key}"]`)
     .forEach(el => el.classList.toggle('folded', shut));
  out.querySelectorAll(`button[data-fold="${key}"]`)
     .forEach(b => b.setAttribute('aria-expanded', String(!shut)));
  if (shut && key.endsWith('|player')) {
    const st = players.get(key.split('|')[0]);
    st?.stop?.();
  }
}

out.addEventListener('click', e => {
  const f = e.target.closest('button.fold');
  if (f) {
    const key = f.dataset.fold;
    folded.has(key) ? folded.delete(key) : folded.add(key);
    applyFold(key);
    return;
  }
  if (e.target.tagName !== 'IMG') return;
  big.src = e.target.src;
  shade.style.display = 'flex';
});

// Collapse every window to its header line, or open them all back up. Only the
// window-level fold is touched -- the sections keep whatever state they had, so
// unfolding does not undo the tidying done inside.
document.getElementById('foldall').addEventListener('click', ev => {
  const keys = [...out.querySelectorAll('section.win')].map(s => `${s.dataset.win}|body`);
  const anyOpen = keys.some(k => !folded.has(k));
  keys.forEach(k => { anyOpen ? folded.add(k) : folded.delete(k); applyFold(k); });
  ev.currentTarget.textContent = anyOpen ? '전부 펼치기' : '전부 접기';
});
shade.addEventListener('click', () => { shade.style.display = 'none'; big.src = ''; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { shade.style.display = 'none'; big.src = ''; }
});
document.getElementById('clear').addEventListener('click', async () => {
  await fetch('/clear', { method: 'POST' });
  seen = -1;
});

tick();
setInterval(tick, 1000);
</script>
